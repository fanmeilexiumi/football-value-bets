name: daily-report

on:
  schedule:
    - cron: "0 3 * * *"    # 03:00 UTC = 11:00 Beijing: review yesterday, then picks from the model alone
    - cron: "0 11 * * *"   # 11:00 UTC = 19:00 Beijing: re-price with injuries, rotation, motivation, weather (adjust.py)
  workflow_dispatch:
    inputs:
      session:
        description: "am = 11:00 review and picks, pm = 19:00 update; empty = by Beijing time"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write  # the run commits journal/ (predictions, results, tuned parameters) back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # a queued run must start from the journal the previous run pushed, not from the commit it was queued at
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install browser for OddsHarvester
        run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: Build report
        run: python -m footy ${SESSION:+--session $SESSION}
        env:
          # optional repository secrets, see README
          SESSION: ${{ github.event.inputs.session }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          OH_PROXY_URL: ${{ secrets.ODDSPORTAL_PROXY_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}  # optional: injuries and formations for 推荐理由
      - name: Save journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal
          git diff --cached --quiet && exit 0
          git commit -m "Update prediction journal [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase origin main; then git push origin HEAD:main && exit 0; else git rebase --abort; fi
            sleep $((2 ** i))
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
