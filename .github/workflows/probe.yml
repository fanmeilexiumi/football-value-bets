name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30) as r:
                  return json.load(r)
          def show(tag, obj, n=3000):
              print("=====", tag); print(json.dumps(obj, ensure_ascii=False)[:n])
          sm = get("https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/summary?event=401915312")
          lf = sm["lastFiveGames"]
          print("lastFive len", len(lf), "keys", list(lf[0]))
          t = lf[0]
          print(json.dumps({k: v for k, v in t.items() if k != "events"}, ensure_ascii=False)[:600])
          print(json.dumps(t["events"][0], ensure_ascii=False)[:1500])
          print(json.dumps(sm["standings"]["groups"][0]["standings"]["entries"][0], ensure_ascii=False)[:300])
          print("groups", len(sm["standings"]["groups"]), [g.get("header") for g in sm["standings"]["groups"]])
          print("header comp", json.dumps(sm["header"]["competitions"][0].get("competitors", [{}])[0].get("team", {}).get("displayName")))
          ts = get("https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/teams/359/schedule?fixture=true")
          print("sched keys", list(ts)); ev = ts.get("events", [])
          print("n events", len(ev)); print(json.dumps(ev[:1], ensure_ascii=False)[:1200])
          PY
