name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          k = os.environ["K"].strip()
          for path in ("status", "fixtures?date=2026-10-21&timezone=UTC", "injuries?date=2026-10-21"):
              req = urllib.request.Request("https://v3.football.api-sports.io/" + path, headers={"x-apisports-key": k})
              d = json.load(urllib.request.urlopen(req, timeout=30))
              r = d.get("response")
              print("=====", path, "errors", d.get("errors"), "results", d.get("results"))
              if path == "status":
                  print(json.dumps(r.get("subscription") if isinstance(r, dict) else r)[:300], json.dumps(r.get("requests") if isinstance(r, dict) else "")[:200])
              else:
                  print(json.dumps((r or [])[:1], ensure_ascii=False)[:700])
          PY
